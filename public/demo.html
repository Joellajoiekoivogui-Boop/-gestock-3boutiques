<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D2C">
<link rel="icon" href="/icon.svg">
<title>Démo caisse MassaGui</title>
<style>
/* Démonstration statique de la caisse MassaGui, au même design que
   l'application : carte de restaurant, vert sapin et or, Inter et
   Playfair Display. Données d'exemple, rien n'est enregistré. */
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(/demo-fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url(/demo-fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url(/demo-fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; font-display: swap; src: url(/demo-fonts/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Playfair Display'; font-weight: 600; font-display: swap; src: url(/demo-fonts/playfair-display-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Playfair Display'; font-weight: 700; font-display: swap; src: url(/demo-fonts/playfair-display-latin-700-normal.woff2) format('woff2'); }

:root {
  --bg: #f3f5f2; --card: #ffffff; --ink: #16201b; --muted: #eaede8; --muted-ink: #5b605b; --border: #e0e4dd; --input: #cdd3cb;
  --green: #0abf65; --green-ink: #0b1a12; --green-strong: #067a40;
  --forest: #0f3d2c; --forest-soft: #e7efe9; --gold: #b8914a; --gold-strong: #82621f;
  --warn: #fbefd2; --warn-ink: #6b4a00; --danger: #a8281a;
  --cat-1: #0f3d2c; --cat-2: #b3432a; --cat-3: #1f6f8b; --cat-4: #7a3d6e; --cat-5: #a8781c; --cat-6: #3c4540;
  --shadow: 0 1px 2px rgb(22 32 27 / 0.05), 0 6px 18px -8px rgb(22 32 27 / 0.12);
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --header: 73px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid rgb(15 61 44 / 0.45); outline-offset: 2px; }
::selection { background: var(--forest-soft); color: var(--forest); }
svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
h1, h2 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.serif { font-family: var(--serif); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* En-tête */
.top { position: sticky; top: 0; z-index: 30; background: rgb(255 255 255 / 0.96); border-bottom: 1px solid var(--border); }
.bar { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: var(--green); color: var(--green-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
.brand b { display: block; font: 700 20px/1.15 var(--serif); }
.brand small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-strong); }
.tabs { display: flex; gap: 4px; padding: 4px; margin: 0 auto; border-radius: 999px; background: var(--muted); }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: none; color: var(--muted-ink); font-weight: 600; font-size: 15px; white-space: nowrap; }
.tab svg { width: 18px; height: 18px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--forest); color: #fff; }
.tab[hidden] { display: none; }
.who { text-align: right; line-height: 1.25; }
.who b { display: block; font-size: 14px; }
.who small { color: var(--muted-ink); font-size: 12px; }
.note { background: var(--warn); color: var(--warn-ink); font-size: 14px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
.bottom { display: none; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--input); background: var(--card); font-weight: 600; font-size: 15px; white-space: nowrap; transition: background-color .15s, border-color .15s, transform .15s; }
.btn:hover { border-color: rgb(15 61 44 / 0.5); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.green { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.green:hover { background: var(--green-strong); border-color: var(--green-strong); color: #fff; }
.btn.green:disabled { opacity: 0.45; }
.btn.forest { background: var(--forest); border-color: var(--forest); color: #fff; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted-ink); }
.btn.ghost:hover { background: var(--muted); color: var(--ink); }

/* Caisse */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 26rem; height: calc(100dvh - var(--header) - var(--note, 0px)); }
.menu { min-width: 0; min-height: 0; overflow-y: auto; padding: 0 24px 32px; display: flex; flex-direction: column; gap: 16px; }
.menu > * { flex: none; }
.menu-top { position: sticky; top: 0; z-index: 10; background: rgb(243 245 242 / 0.96); margin: 0 -24px; padding: 20px 24px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
.searchrow { display: flex; gap: 12px; align-items: center; }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 16px; top: 16px; color: var(--muted-ink); pointer-events: none; }
.search input { width: 100%; height: 52px; border: 1px solid transparent; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); padding: 0 48px; font-size: 16px; }
.search input::placeholder { color: var(--muted-ink); }
.search .clear { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: 0; border-radius: 999px; background: none; color: var(--muted-ink); display: grid; place-items: center; }
.cats { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cat { width: 88px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: center; }
.cat .ring { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); transition: border-color .15s; }
.cat .ring svg { width: 28px; height: 28px; stroke-width: 1.75; }
.cat:hover .ring { border-color: rgb(15 61 44 / 0.5); }
.cat[aria-pressed="true"] .ring { background: var(--forest); border-color: var(--forest); color: #fff !important; }
.cat .name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.cat[aria-pressed="true"] .name { color: var(--forest); }
.cat .n { display: block; font-size: 12px; font-weight: 500; color: var(--muted-ink); }
.section { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section h2 { font: 700 24px var(--serif); }
.section p { color: var(--muted-ink); font-size: 14px; }
.pgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: 16px; }
.prod { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; padding: 0; text-align: left; background: var(--card); border: 1px solid transparent; border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; }
.prod:hover:not(:disabled) { transform: translateY(-2px); }
.prod:active:not(:disabled) { transform: scale(0.98); }
.prod.in { border-color: var(--forest); box-shadow: 0 0 0 2px var(--forest); }
.photo { position: relative; margin: 8px 8px 0; aspect-ratio: 4 / 1; border-radius: 12px; display: grid; place-items: center; }
.photo svg { width: 32px; height: 32px; stroke-width: 1.5; opacity: 0.8; }
.prod:disabled .photo { filter: grayscale(1); opacity: 0.6; }
.pill { position: absolute; top: 8px; left: 8px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--forest); color: #fff; }
.pill.pop { background: var(--gold-strong); }
.pill.out { background: var(--danger); }
.qty { position: absolute; top: 8px; right: 8px; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 999px; background: var(--green); color: var(--green-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: 0 2px 6px rgb(0 0 0 / 0.15); }
.pbody { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 12px; flex: 1; }
@media (max-width: 1023px) { .photo { aspect-ratio: 3 / 1; } }
.pname { font-weight: 700; font-size: 18px; line-height: 1.3; }
.pdesc { color: var(--muted-ink); font-size: 14px; line-height: 1.35; }
.prod:disabled .pbody { color: var(--muted-ink); }
.pfoot { margin-top: auto; padding-top: 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.price { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
.price small { font-size: 12px; font-weight: 600; color: var(--muted-ink); margin-left: 4px; }
.plus { width: 36px; height: 36px; border-radius: 999px; background: var(--forest); color: #fff; display: grid; place-items: center; flex: none; transition: background-color .15s; }
.prod:hover:not(:disabled) .plus { background: var(--green); color: var(--green-ink); }
.prod:disabled .plus { background: var(--muted); color: var(--muted-ink); }
.empty { text-align: center; color: var(--muted-ink); padding: 48px 16px; }
.empty b { display: block; color: var(--ink); font: 600 20px var(--serif); margin-bottom: 4px; }

.ticket { background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.thead { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
.thead h2 { font: 700 24px var(--serif); display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.thead h2 small { font: 500 15px var(--sans); color: var(--muted-ink); }
.lines { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
.line { padding: 10px 20px; border-bottom: 1px solid var(--border); display: grid; gap: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lname { font-weight: 600; font-size: 16px; line-height: 1.3; }
.ltotal { font-weight: 700; font-size: 17px; white-space: nowrap; }
.line small { color: var(--muted-ink); font-size: 15px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border: 1px solid var(--input); background: var(--card); border-radius: 999px; display: grid; place-items: center; }
.step button:hover:not(:disabled) { border-color: var(--forest); }
.step button:disabled { opacity: 0.4; }
.step span { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--input); border-radius: 999px; font-weight: 700; font-size: 17px; }
.tfoot { flex: none; border-top: 1px solid var(--border); padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.total span { font: 700 24px var(--serif); }
.total b { font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
.pay { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.credit { background: var(--warn); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.credit p { color: var(--warn-ink); font-size: 14px; font-weight: 600; }
.credit .fields { display: grid; grid-template-columns: 3fr 2fr; gap: 8px; }
.credit input { height: 44px; border: 1px solid var(--input); border-radius: 999px; background: var(--card); padding: 0 16px; min-width: 0; }
.pay button { min-height: 52px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; font-size: 14px; font-weight: 600; line-height: 1.15; text-align: center; }
.pay button:hover { border-color: rgb(15 61 44 / 0.5); }
.pay button[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #fff; }
.pay button[aria-pressed="true"] svg { color: var(--gold); }
.cash { background: var(--muted); border-radius: 14px; padding: 8px; display: grid; gap: 6px; }
.cash .amounts { display: flex; gap: 6px; }
.cash .amounts button { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-weight: 700; font-size: 15px; }
.cash .amounts button[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #fff; }
.cash .change { display: flex; align-items: baseline; justify-content: space-between; min-height: 30px; padding: 0 4px; }
.cash .change b { font-size: 24px; letter-spacing: -0.01em; }
.cash .change.minus b { color: var(--danger); }
.go { min-height: 64px; width: 100%; justify-content: space-between; padding: 0 22px; font-size: 19px; }
.go b { font-size: 20px; }
.cartbar { display: none; }

/* Ventes et tableau de bord */
.page { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 32px max(24px, env(safe-area-inset-left, 0px)); max-width: 1400px; display: grid; gap: 16px; }
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.phead h1 { font: 700 32px/1.15 var(--serif); }
.phead p { color: var(--muted-ink); margin-top: 6px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.banner { background: var(--forest); color: #fff; border-radius: 18px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 40px; }
.banner .label { font-size: 14px; font-weight: 600; color: #e3c88f; }
.banner .big { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; margin-top: 6px; }
.banner dl { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 0; padding-bottom: 4px; }
.banner dt { font-size: 14px; color: rgb(255 255 255 / 0.75); }
.banner dd { margin: 0; font-size: 20px; font-weight: 700; }
.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.panel.pad { padding: 20px; }
.panel h2 { font: 600 20px var(--serif); }
.panel h2 + p { color: var(--muted-ink); font-size: 14px; margin-top: 2px; }
.bars { display: grid; gap: 14px; margin-top: 16px; }
.track { height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; margin: 6px 0 4px; }
.fill { height: 100%; border-radius: 999px; }
.bars small { color: var(--muted-ink); font-size: 13px; }
.low { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--warn); color: var(--warn-ink); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.twrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-ink); background: rgb(234 237 232 / 0.6); padding: 12px; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--border); }
.num { text-align: right; white-space: nowrap; }
td .sub { display: none; color: var(--muted-ink); font-size: 13px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; background: #e3f4ea; color: #0b5c34; }
.credits { color: var(--muted-ink); font-size: 13px; }
/* Boutiques et dépenses */
.shopbar { background: var(--forest); color: #fff; }
.shopbar .in { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
.shopbar .lbl { display: flex; align-items: center; gap: 6px; flex: none; color: #e3c88f; font-size: 14px; font-weight: 600; }
.shopbar .lbl svg, .chooser svg, .expenses h2 svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.shopbar button { flex: none; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: none; color: rgb(255 255 255 / 0.85); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.shopbar button[aria-pressed="true"] { background: #e3c88f; color: var(--forest); }
.chooser { max-width: 560px; margin: 32px auto; text-align: center; display: grid; gap: 14px; padding: 24px; }
.chooser .ring { width: 56px; height: 56px; border-radius: 50%; background: var(--forest); color: #e3c88f; display: grid; place-items: center; margin: 0 auto; }
.chooser h1 { font: 700 26px/1.2 var(--serif); }
.chooser .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chooser .opts .btn { min-height: 64px; font-size: 18px; justify-content: center; }
.shopname { display: block; color: #82621f; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.expenses h2 { display: flex; align-items: center; gap: 8px; font: 600 20px var(--serif); }
.expenses .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.expenses form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.expenses label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.expenses input { height: 48px; border: 1px solid var(--input); border-radius: 999px; background: var(--card); padding: 0 16px; font: inherit; min-width: 0; }
.expenses .err { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 0; }
.expenses ul { list-style: none; margin: 0; padding: 0; }
.expenses li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--border); }
.expenses li:first-child { border-top: 0; }
.expenses li small { display: block; color: var(--muted-ink); font-size: 13px; }
.expenses .amt { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.expenses .del { width: 40px; height: 40px; border: 0; border-radius: 999px; background: none; color: var(--muted-ink); cursor: pointer; display: grid; place-items: center; }
.expenses .del:hover { background: var(--muted); color: var(--danger); }
.expenses .del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.expenses .empty2 { padding: 20px; text-align: center; color: var(--muted-ink); }
@media (max-width: 767px) { .expenses form { grid-template-columns: 1fr; } .chooser .opts { grid-template-columns: 1fr; } }
/* Rôle de démonstration, stocks, impression */
.shopbar .sep { flex: 1; min-width: 12px; }
.shopbar .fixed { flex: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
.flash { position: fixed; z-index: 60; left: 50%; top: 84px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 18px; font-weight: 600; box-shadow: var(--shadow); }
td .sub2 { display: block; color: var(--muted-ink); font-size: 13px; }
.stockbar { display: block; height: 8px; width: 120px; max-width: 100%; border-radius: 999px; background: var(--muted); overflow: hidden; margin-top: 6px; }
.stockbar span { display: block; height: 100%; border-radius: 999px; }
.badge.out { background: #f8dcd7; color: var(--danger); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.acts .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }
.mv-plus { color: #0b5c34; font-weight: 700; }
.mv-minus { color: var(--danger); font-weight: 700; }
.dialog label.f { display: grid; gap: 6px; text-align: left; font-size: 14px; font-weight: 600; }
.dialog label.f input { height: 48px; border: 1px solid var(--input); border-radius: 999px; padding: 0 16px; font: inherit; }
.dialog .err { color: var(--danger); font-size: 13px; font-weight: 600; text-align: left; }
.sheet { background: #fff; color: #000; border-radius: 18px; box-shadow: var(--shadow); padding: 28px; font-size: 14px; }
.sheet header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-bottom: 2px solid #000; padding-bottom: 10px; }
.sheet h1 { font: 700 24px/1.2 var(--serif); }
.sheet h2 { font-size: 15px; font-weight: 700; margin: 18px 0 4px; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sheet th { background: none; color: #000; font-size: 11px; border-bottom: 1px solid rgb(0 0 0 / 0.35); padding: 6px 8px; }
.sheet td { border-top: 0; border-bottom: 1px solid rgb(0 0 0 / 0.1); padding: 6px 8px; }
.sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.sheet .tot td { font-weight: 700; font-size: 15px; border-bottom: 0; }
.sheet .cancelled td { text-decoration: line-through; opacity: 0.6; }

function recordSale(lines, pay, no, time, shop) {

}

}

function checkout() {
  if (!state.cart.length) return;
  const lines = state.cart.map((l) => ({ ...l }));
  lines.forEach((l) => { const p = prod(l.id); if (p.stock !== null) p.stock -= l.q; });
  const sale = recordSale(lines, state.pay, state.nextNo++, null, state.shop);
  lines.forEach((l) => { const p = prod(l.id); if (p.stock !== null) addMovement(p, 'Vente', -l.q, 'Vente ' + sale.no); });

}

function render() {

  document.querySelectorAll('.tabs [data-admin]').forEach((b) => { b.hidden = !isAdminRole(); });
  const active = document.activeElement && ['search', 'q'].includes(document.activeElement.id) ? document.activeElement.id : null;
  const pos = active ? document.activeElement.selectionStart : null;
  document.querySelectorAll('.tabs [data-view]').forEach((b) => b.toggleAttribute('aria-current', false));
  document.querySelector(`.tabs [data-view="${state.view === 'dossier' ? 'credits' : state.view === 'impression' ? 'bord' : state.view}"]`).setAttribute('aria-current', 'page');

  const html = ({ caisse: viewCaisse, ventes: viewVentes, bord: viewBord, credits: viewCredits, dossier: viewDossier, stocks: viewStocks, impression: viewImpression })[state.view]();
  document.getElementById('main').innerHTML = html;
  if (state.flash) {
    document.querySelector('.flash')?.remove();
    const note = document.createElement('p');
    note.className = 'flash'; note.setAttribute('role', 'status'); note.textContent = state.flash;
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 3500);
    state.flash = '';
  }
  renderBottom();
  if (active) { const input = document.getElementById(active); input.focus(); input.setSelectionRange(pos, pos); }
}
function go(view) { state.view = view; try { history.replaceState(null, '', '#' + view); } catch (e) {} state.cartOpen = false; document.getElementById('modal').innerHTML = ''; render(); window.scrollTo(0, 0); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-cart-toggle]'); if (!t) return;
  const d = t.dataset;
  if (d.view) go(d.view);
  else if (d.go) go(d.go);
  else if (d.add) add(d.add);
  else if (d.cat) { state.cat = d.cat; render(); }
  else if (d.qty) setQty(d.qty, inCart(d.qty) + Number(d.d));
  else if (d.pay) { state.pay = d.pay; state.received = ''; render(); }
  else if (d.recv) { state.received = state.received === d.recv ? '' : d.recv; render(); }
  else if ('empty' in d) { state.cart = []; state.received = ''; render(); }
  else if ('clear' in d) { state.search = ''; render(); document.getElementById('search').focus(); }
  else if ('cartToggle' in d) { state.cartOpen = !state.cartOpen; render(); }
  else if ('checkout' in d) checkout();
  else if ('close' in d) document.getElementById('modal').innerHTML = '';
  else if (d.role) {
    if (d.role === state.role) return;
    if (d.role === 'cashier') { state.adminShop = state.shop; state.shop = 'np1'; } else state.shop = state.adminShop;
    state.role = d.role; state.cart = []; state.expErr = {}; render();
  }
  else if (d.stock) { state.stockErr = ''; stockDialog(d.stock, d.type); }
  else if ('print' in d) {
    let rule = document.getElementById('a4-page-rule');
    if (!rule) { rule = document.createElement('style'); rule.id = 'a4-page-rule'; rule.textContent = '@page { size: A4; margin: 12mm; }'; document.head.appendChild(rule); }
    window.print();
  }
  else if (d.shop) { state.shop = d.shop; state.cart = []; state.cat = 'all'; state.expErr = {}; render(); }
  else if (d.delExp) {
    const x = state.expenses.find((r) => r.id === d.delExp);
    if (x && confirm(`Supprimer la dépense « ${x.label} » (${money(x.amount)}) ?`)) { state.expenses = state.expenses.filter((r) => r !== x); render(); }
  }
  else if (d.pick) { state.pickedId = d.pick; render(); }
  else if ('unpick' in d) { state.pickedId = null; render(); }
  else if (d.dossier) { state.dossier = d.dossier; go('dossier'); }
  else if (d.settle) settleDialog(d.settle);
  else if (d.method) settleDialog(d.no, d.method);
  else if (d.confirm) {
    const s = state.sales.find((r) => r.no === d.confirm);
    s.paid = true; s.paidWith = d.with; s.paidWhen = 'aujourd’hui à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('modal').innerHTML = ''; render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { state.search = e.target.value; render(); }
  else if (e.target.id === 'q') { state.q = e.target.value; render(); }
  else if (e.target.id === 'cust' || e.target.id === 'phone') {
    state[e.target.id === 'cust' ? 'customer' : 'phone'] = e.target.value;
    const go = document.querySelector('[data-checkout]');
    if (go) go.disabled = !(state.cart.length && creditReady());
    const box = document.getElementById('picks'); if (box) box.innerHTML = picks();
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'stock-form') {
    e.preventDefault();
    const p = prod(e.target.dataset.id), restock = e.target.dataset.type === 'restock';
    const raw = document.getElementById('sk-qty').value.replace(/\s/g, ''), qty = Number(raw), reason = document.getElementById('sk-reason').value.trim();
    let err = '';
    if (!raw || !Number.isInteger(qty) || qty === 0) err = 'Indiquez une quantité (nombre entier).';
    else if (restock && qty < 0) err = 'Un approvisionnement ajoute du stock : quantité positive.';
    else if (!restock && reason.length < 3) err = 'Le motif de l’ajustement est obligatoire.';
    else if (p.stock + qty < 0) err = `Le stock ne peut pas devenir négatif (disponible : ${p.stock}).`;
    if (err) { document.getElementById('sk-err').textContent = err; return; }
    p.stock += qty;
    addMovement(p, restock ? 'Approvisionnement' : 'Ajustement', qty, reason || (restock ? 'Livraison' : ''));
    document.getElementById('modal').innerHTML = ''; render();
    return;
  }
  if (e.target.id !== 'exp-form') return;
  e.preventDefault();
  const label = document.getElementById('exp-label').value.trim(), raw = document.getElementById('exp-amount').value.replace(/\s/g, '');
  const amount = Number(raw), err = { labelValue: label, amountValue: raw };
  if (label.length < 2) err.label = 'Indiquez ce qui a été acheté.';
  if (!raw || !Number.isInteger(amount) || amount <= 0) err.amount = 'Prix en francs, nombre entier.';
  state.expErr = err;
  if (!err.label && !err.amount) {
    state.expenses.unshift({ id: 'e' + Date.now(), shop: state.shop, label, amount, by: USERS[state.role].name, time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) });
    state.expErr = {};
  }
  render();
  document.getElementById(err.label ? 'exp-label' : err.amount ? 'exp-amount' : 'exp-label')?.focus();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal').innerHTML) document.getElementById('modal').innerHTML = '';
  else if (state.cartOpen) { state.cartOpen = false; render(); }
});
// Hauteur du bandeau de démonstration et de la barre des boutiques (la caisse occupe le reste).
function setNote() { document.documentElement.style.setProperty('--note', document.getElementById('note').offsetHeight + document.getElementById('shopbar').offsetHeight + 'px'); }
window.addEventListener('resize', setNote);

// Journée de vente de 7h à 7h : avant 7h du matin, c'est encore la veille.
const today = new Date(Date.now() - 7 * 3600000).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Africa/Conakry' });
document.body.dataset.today = today.charAt(0).toUpperCase() + today.slice(1);
document.body.dataset.todayLong = new Date(Date.now() - 7 * 3600000).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Africa/Conakry' });
// Heures des ventes d'exemple : réparties entre 7h (début de la journée de vente) et maintenant.
function seedTime(i, n) {
  const now = Date.now(), dayStart = now - ((now - 7 * 3600000) % 86400000); // Conakry = UTC
  const t = dayStart + ((now - dayStart) * (i + 1)) / (n + 1);
  return new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Conakry' });
}
// Ventes d'exemple déjà enregistrées aujourd'hui.
[[['p2', 2], ['p13', 1]], [['p8', 2], ['p6', 2]], [['p17', 3], ['p9', 3]], [['p3', 1], ['p11', 2]], [['p5', 1], ['p14', 2]]]
  .forEach((items, i) => {
    const sale = recordSale(items.map(([id, q]) => ({ id, q })), ['cash', 'om', 'cash', 'credit', 'cash'][i], 17 + i, seedTime(i, 5));
    if (sale.pay === 'credit') { const c = openDossier('Mamadou Bah', '+224 621 00 00 01'); c.since = '12 novembre'; sale.customerId = c.id; sale.customer = c.name; sale.phone = c.phone; }
  });
// Ventes d'exemple de Nabele Plus 2 (ses propres produits).
[[['q1', 1], ['q5', 2]], [['q3', 2], ['q7', 2]], [['q0', 1], ['q9', 2]]]
  .forEach((items, i) => {
    const sale = recordSale(items.map(([id, q]) => ({ id, q })), ['cash', 'om', 'credit'][i], 30 + i, seedTime(i, 3));
    if (sale.pay === 'credit') { const c = openDossier('Aïssatou Camara', '+224 624 00 00 04'); c.since = '15 novembre'; sale.customerId = c.id; sale.customer = c.name; sale.phone = c.phone; }
  });
// Dépenses d'exemple : condiments achetés avec l'argent de la caisse.
state.expenses = [
  { id: 'e1', shop: 'np1', label: 'Piment, oignons et ail', amount: 15000, by: 'Awa Camara', time: '08:10' },
  { id: 'e2', shop: 'np1', label: 'Cubes et sel', amount: 6000, by: 'Awa Camara', time: '10:35' },
  { id: 'e3', shop: 'np2', label: 'Huile (5 L)', amount: 45000, by: 'Ibrahima Barry', time: '09:20' },
];
// Crédits d'avant aujourd'hui (exemples), dont un réglé ce matin.
[['Mamadou Bah', '+224 621 00 00 01', [['p0', 1]], 'Hier', false], ['Fatoumata Diallo', '+224 622 00 00 02', [['p8', 1], ['p10', 2]], 'Hier', true],
 ['Ibrahima Sow', '+224 623 00 00 03', [['p2', 2]], 'Lundi', false]].forEach(([name, phone, items, when, paid], i) => {
  const c = openDossier(name, phone); if (c.since === 'Aujourd’hui') c.since = '10 novembre';
  const sale = recordSale(items.map(([id, q]) => ({ id, q })), 'credit', 10 + i, '');
  state.sales.push(state.sales.shift());
  Object.assign(sale, { before: when, customerId: c.id, customer: c.name, phone: c.phone });
  if (paid) Object.assign(sale, { paid: true, paidWith: 'om', paidWhen: 'aujourd’hui à 09:15' });
});
// Vendeurs des ventes d'exemple, et approvisionnements du matin.
state.sales.forEach((x) => { x.by = x.shop === 'np2' ? 'Ibrahima Barry' : 'Awa Camara'; });
[['p10', 24, '07:30'], ['p11', 48, '07:30'], ['p13', 30, '07:45'], ['q5', 24, '07:40'], ['q8', 40, '07:40']].forEach(([id, qty, time]) => {
  const p = prod(id);
  state.movements.push({ id: 'm-' + id, shop: p.shop, product: p.name, type: 'Approvisionnement', qty, after: p.stock + qty, reason: 'Livraison du fournisseur', by: USERS.admin.name, time });
});
state.movements.reverse();
const VIEWS = ['caisse', 'ventes', 'bord', 'credits', 'stocks', 'impression'];
const start = location.hash.slice(1);
if (VIEWS.includes(start)) state.view = start;
render();
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== state.view) go(v); });
</script>
