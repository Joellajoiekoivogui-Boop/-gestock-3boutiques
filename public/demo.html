<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0ABF65">
<link rel="icon" href="/icon.svg">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Démo caisse MassaGui</title>

<style>
/* Mise en page : barre latérale noire + zone de travail ; à la caisse, le panier occupe une colonne fixe à droite
   (tiroir en bas d'écran sur téléphone). Charte du projet : vert #0ABF65, noir #111, gris clair. */
:root {
  --bg: #f5f6f7; --card: #ffffff; --fg: #111111; --muted: #eef0f2; --muted-fg: #5b6168;
  --border: #e2e5e9; --primary: #0abf65; --on-primary: #111111; --primary-strong: #067a40;
  --accent: #e3f8ec; --accent-fg: #0b5c34; --warn: #fff4d6; --warn-fg: #7a5400; --danger: #b42318; --danger-bg: #fde8e6;
  --side: #111111; --side-fg: #f2f3f4; --side-muted: #9aa1a8; --side-hover: #1f2422;
  --t1: #0b8a4c; --t2: #a36f00; --t3: #2f55b0; --t4: #b23a26; --t5: #6d46a8; --t6: #5b6168;
  --shadow: 0 1px 2px rgb(17 17 17 / 0.06);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1110; --card: #171b19; --fg: #f2f3f4; --muted: #222825; --muted-fg: #a3aab0;
    --border: #2b322f; --primary: #0abf65; --on-primary: #111111; --primary-strong: #4fd995;
    --accent: #12331f; --accent-fg: #9be7bf; --warn: #3a2e0a; --warn-fg: #f2cf73; --danger: #ff8a7d; --danger-bg: #3b1714;
    --side: #080a09; --side-fg: #f2f3f4; --side-muted: #9aa1a8; --side-hover: #1a1f1d;
    --t1: #4fd995; --t2: #f2cf73; --t3: #8fb0ff; --t4: #ff9c8a; --t5: #c3a3f5; --t6: #a3aab0;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1110; --card: #171b19; --fg: #f2f3f4; --muted: #222825; --muted-fg: #a3aab0;
  --border: #2b322f; --primary: #0abf65; --on-primary: #111111; --primary-strong: #4fd995;
  --accent: #12331f; --accent-fg: #9be7bf; --warn: #3a2e0a; --warn-fg: #f2cf73; --danger: #ff8a7d; --danger-bg: #3b1714;
  --side: #080a09; --side-fg: #f2f3f4; --side-muted: #9aa1a8; --side-hover: #1a1f1d;
  --t1: #4fd995; --t2: #f2cf73; --t3: #8fb0ff; --t4: #ff9c8a; --t5: #c3a3f5; --t6: #a3aab0;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 1px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }

.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 20px 16px; }
.logo { width: 40px; height: 40px; border-radius: 8px; background: #fff; color: #111; display: grid; place-items: center; font-weight: 700; flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; }
.brand small { color: var(--side-muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; flex: 1; }
.nav-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); padding: 14px 8px 6px; }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: color-mix(in srgb, var(--side-fg) 85%, transparent); padding: 10px; border-radius: 6px; text-align: left; }
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.nav svg, .btn svg, .chip svg { width: 16px; height: 16px; flex: none; }
.side-foot { border-top: 1px solid rgb(255 255 255 / 0.1); padding: 14px 20px; font-size: 12px; color: var(--side-muted); }
.side-foot b { display: block; color: var(--side-fg); font-size: 14px; font-weight: 500; }

.main { min-width: 0; min-height: 0; overflow-y: auto; }
.view { padding-block: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; max-width: 1400px; }
.demo-note { background: var(--warn); color: var(--warn-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head p { color: var(--muted-fg); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 8px 14px; font-weight: 500; min-height: 40px; }
.btn:hover { background: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
.btn.primary:hover { filter: brightness(0.96); }
.btn.big { min-height: 52px; font-size: 17px; width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 18px 20px; }
.card h2 + p { color: var(--muted-fg); margin-top: 2px; }

/* Caisse */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.pos-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pos-top { padding-top: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; display: flex; flex-direction: column; gap: 12px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); padding: 0 44px 0 38px; font: inherit; font-size: 16px; }
.search svg { position: absolute; left: 12px; top: 14px; width: 16px; height: 16px; color: var(--muted-fg); }
.search button { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; border-radius: 6px; color: var(--muted-fg); font-size: 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 500; white-space: nowrap; }
.chip small { margin-left: 6px; font-size: 12px; color: var(--muted-fg); }
.chip[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip[aria-selected="true"] small { color: inherit; opacity: 0.8; }
.grid-wrap { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.prod { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.15s ease; }
.prod:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-2px); }
.prod:active:not(:disabled) { transform: scale(0.97); }
.prod.in { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.prod:disabled { opacity: 0.55; cursor: not-allowed; }
.thumb { aspect-ratio: 2 / 1; display: grid; place-items: center; font-weight: 700; font-size: 20px; letter-spacing: 0.03em; background: color-mix(in srgb, var(--tone) 15%, var(--card)); color: color-mix(in srgb, var(--tone) 80%, var(--fg)); }
.prod-body { display: flex; flex-direction: column; gap: 4px; padding: 12px; flex: 1; }
.prod-name { font-weight: 500; line-height: 1.3; }
.prod-price { margin-top: auto; font-size: 16px; font-weight: 700; }
.badge { display: inline-block; width: fit-content; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; }
.badge.ok { background: var(--accent); color: var(--accent-fg); }
.badge.warn { background: var(--warn); color: var(--warn-fg); }
.badge.bad { background: var(--danger-bg); color: var(--danger); }
.qty { position: absolute; top: 8px; right: 8px; background: var(--fg); color: var(--card); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
.empty { text-align: center; color: var(--muted-fg); padding: 48px 16px; }
.empty b { display: block; color: var(--fg); font-weight: 500; margin-bottom: 4px; }

.cart { background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.cart-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); min-height: 53px; }
.cart-head small { color: var(--muted-fg); font-weight: 400; font-size: 13px; }
.link { border: 0; background: none; color: var(--muted-fg); padding: 6px 8px; border-radius: 6px; }
.link:hover { background: var(--muted); color: var(--fg); }
.lines { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
.line { padding: 12px 16px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.line small { color: var(--muted-fg); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 36px; height: 36px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; font-size: 18px; line-height: 1; }
.step button.rm { border-color: transparent; color: var(--muted-fg); font-size: 15px; }
.step span { min-width: 32px; text-align: center; font-weight: 600; }
.cart-foot { border-top: 1px solid var(--border); padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; display: grid; gap: 12px; }
.total { font-size: 24px; font-weight: 700; }
.muted { color: var(--muted-fg); }
.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay button { min-height: 44px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; font-weight: 500; padding: 6px; }
.pay button[aria-pressed="true"] { border-color: var(--primary); background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 1px var(--primary); }
.cartbar { display: none; }

/* Chiffres, listes, tableaux */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { padding: 16px 20px; display: grid; gap: 6px; }
.stat span { color: var(--muted-fg); }
.stat b { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.stat small { color: var(--muted-fg); font-size: 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.bars { display: grid; gap: 14px; margin-top: 14px; }
.bar-track { height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; margin: 4px 0; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--primary-strong); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-fg); background: color-mix(in srgb, var(--muted) 60%, transparent); padding: 10px 12px; white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
td small { display: none; color: var(--muted-fg); font-size: 12px; }

/* Fenêtre du reçu */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / 0.5); display: grid; place-items: center; padding: 16px; z-index: 30; }
.dialog { background: var(--card); border-radius: 14px; padding: 24px; width: min(380px, 100%); display: grid; gap: 14px; text-align: center; }
.check { width: 56px; height: 56px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; margin: 0 auto; font-size: 28px; }
.ticket { font-family: var(--mono); font-size: 12px; text-align: left; border: 1px dashed var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 4px; }
.ticket hr { border: 0; border-top: 1px dashed var(--border); width: 100%; margin: 4px 0; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { flex-direction: row; align-items: center; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .brand { padding: 10px 0; } .brand div, .nav-title, .side-foot { display: none; } .logo { width: 32px; height: 32px; font-size: 12px; }
  .nav { flex-direction: row; padding: 0; } .nav button { white-space: nowrap; padding: 8px 10px; }
  .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
  .pos { grid-template-columns: minmax(0, 1fr); }
  .pos-top { padding-top: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid-wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 96px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cart { position: fixed; inset: auto 0 0 0; max-height: 88%; border-left: 0; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; z-index: 25; box-shadow: 0 -8px 24px rgb(0 0 0 / 0.18); }
  .cart:not(.open) { display: none; }
  .cartbar { display: block; position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--card); border-top: 1px solid var(--border); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .cartbar .btn { justify-content: space-between; padding: 0 18px; }
  .hide-sm { display: none; } td small { display: block; }
}
@media (prefers-reduced-motion: reduce) { .prod { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">MG</span><div><b>MassaGui Fils SARL.U</b><small>Gestion restaurant</small></div></div>
    <nav class="nav" aria-label="Navigation principale">
      <span class="nav-title">Vente</span>
      <button type="button" data-view="caisse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l3 13h11l2-9H6"/></svg>Caisse</button>
      <button type="button" data-view="ventes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Mes ventes</button>
      <span class="nav-title">Pilotage</span>
      <button type="button" data-view="bord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Tableau de bord</button>
    </nav>
    <div class="side-foot"><b>Démonstration</b>Données d’exemple</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>

<script>
const CATS = [
  { id: 'af', name: 'Plats africains', tone: 3 }, { id: 'eu', name: 'Plats européens', tone: 6 },
  { id: 'bo', name: 'Boissons', tone: 1 }, { id: 'de', name: 'Desserts', tone: 5 }, { id: 'pd', name: 'Petit-déjeuner', tone: 2 },
];
const PRODUCTS = [
  ['Attiéké poisson braisé', 'af', 60000], ['Fouti au poisson', 'af', 40000], ['Poulet yassa', 'af', 55000],
  ['Riz gras au poulet', 'af', 45000], ['Sauce feuille de manioc', 'af', 35000],
  ['Pizza margherita', 'eu', 70000], ['Salade composée', 'eu', 30000], ['Spaghetti bolognaise', 'eu', 50000], ['Steak frites', 'eu', 85000],
  ['Café expresso', 'bo', 10000], ['Coca-Cola 33 cl', 'bo', 12000, 6], ['Eau minérale 1,5 L', 'bo', 10000, 44],
  ['Jus de bissap', 'bo', 15000, 3], ['Jus de gingembre', 'bo', 15000, 20],
  ['Crêpe au chocolat', 'de', 25000], ['Salade de fruits', 'de', 20000],
  ['Croissant', 'pd', 8000, 0], ['Omelette complète', 'pd', 30000],
].map(([name, cat, price, stock], i) => ({ id: 'p' + i, name, cat, price, stock: stock === undefined ? null : stock }));
const PAYMENTS = ['Espèces', 'Orange Money', 'MTN Mobile Money', 'Virement bancaire'];

const state = { view: 'caisse', cat: 'all', search: '', cart: [], pay: PAYMENTS[0], cartOpen: false, sales: [], nextNo: 22 };
const money = (v) => new Intl.NumberFormat('fr-FR').format(v) + ' GNF';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
const prod = (id) => PRODUCTS.find((p) => p.id === id);
const initials = (name) => { const w = name.trim().split(/\s+/); return ((w[1] ? w[0][0] + w[1][0] : w[0].slice(0, 2))).toUpperCase(); };
const inCart = (id) => (state.cart.find((l) => l.id === id) || { q: 0 }).q;
const cartTotal = () => state.cart.reduce((s, l) => s + prod(l.id).price * l.q, 0);
const cartCount = () => state.cart.reduce((s, l) => s + l.q, 0);

function recordSale(lines, pay, no, time) {
  const total = lines.reduce((s, l) => s + prod(l.id).price * l.q, 0);
  const now = new Date();
  const sale = { no: 'MG-2026-' + String(no).padStart(6, '0'), time: time || now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), lines, pay, total };
  state.sales.unshift(sale);
  return sale;
}

function add(id) {
  const p = prod(id);
  if (p.stock !== null && inCart(id) >= p.stock) return;
  const line = state.cart.find((l) => l.id === id);
  if (line) line.q += 1; else state.cart.push({ id, q: 1 });
  render();
}
function setQty(id, q) {
  const p = prod(id);
  if (q <= 0) state.cart = state.cart.filter((l) => l.id !== id);
  else state.cart.find((l) => l.id === id).q = p.stock === null ? q : Math.min(q, p.stock);
  render();
}
function validate() {
  if (!state.cart.length) return;
  const lines = state.cart.map((l) => ({ ...l }));
  lines.forEach((l) => { const p = prod(l.id); if (p.stock !== null) p.stock -= l.q; });
  const sale = recordSale(lines, state.pay, state.nextNo++);
  state.cart = []; state.cartOpen = false; state.pay = PAYMENTS[0];
  render(); showReceipt(sale);
}

function showReceipt(sale) {
  document.getElementById('modal').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Vente enregistrée"><div class="dialog">
    <div class="check" aria-hidden="true">✓</div>
    <div><h2>Vente enregistrée</h2><p class="muted">Reçu n° <b>${sale.no}</b></p></div>
    <div class="ticket">
      <b style="text-align:center">MASSAGUI FILS SARL.U</b><hr>
      ${sale.lines.map((l) => `<div>${esc(prod(l.id).name)}</div><div class="row"><span>${l.q} x ${new Intl.NumberFormat('fr-FR').format(prod(l.id).price)}</span><span>${new Intl.NumberFormat('fr-FR').format(prod(l.id).price * l.q)}</span></div>`).join('')}
      <hr><div class="row"><b>TOTAL</b><b>${money(sale.total)}</b></div><div class="row"><span>Paiement</span><span>${esc(sale.pay)}</span></div>
    </div>
    <div class="row"><button type="button" class="btn" data-go="ventes" style="flex:1">Mes ventes</button><button type="button" class="btn primary" data-close style="flex:1">Nouvelle vente</button></div>
  </div></div>`;
  document.querySelector('[data-close]').focus();
}

function viewCaisse() {
  const q = norm(state.search.trim());
  const list = PRODUCTS.filter((p) => (state.cat === 'all' || p.cat === state.cat) && (!q || norm(p.name).includes(q)));
  const chips = [{ id: 'all', name: 'Tout', n: PRODUCTS.length }, ...CATS.map((c) => ({ ...c, n: PRODUCTS.filter((p) => p.cat === c.id).length }))];
  const cards = list.map((p) => {
    const tone = CATS.find((c) => c.id === p.cat).tone, qty = inCart(p.id), left = p.stock === null ? null : p.stock - qty, out = p.stock === 0;
    return `<li><button type="button" class="prod${qty ? ' in' : ''}" data-add="${p.id}" ${out ? 'disabled' : ''} aria-label="Ajouter ${esc(p.name)}, ${money(p.price)}">
      <span class="thumb" style="--tone: var(--t${tone})" aria-hidden="true">${initials(p.name)}</span>
      <span class="prod-body"><span class="prod-name">${esc(p.name)}</span><span class="prod-price">${money(p.price)}</span>
      ${out ? '<span class="badge bad">Rupture</span>' : left !== null && left <= 5 ? `<span class="badge warn">Reste ${left}</span>` : ''}</span>
      ${qty ? `<span class="qty">×${qty}</span>` : ''}</button></li>`;
  }).join('');
  const lines = state.cart.map((l) => { const p = prod(l.id); return `<li class="line">
      <div class="row"><span style="font-weight:500">${esc(p.name)}</span><b>${money(p.price * l.q)}</b></div>
      <div class="row"><small>${money(p.price)} / unité</small><div class="step">
        <button type="button" data-qty="${p.id}" data-d="-1" aria-label="Diminuer la quantité de ${esc(p.name)}">−</button><span>${l.q}</span>
        <button type="button" data-qty="${p.id}" data-d="1" aria-label="Augmenter la quantité de ${esc(p.name)}" ${p.stock !== null && l.q >= p.stock ? 'disabled' : ''}>+</button>
        <button type="button" class="rm" data-qty="${p.id}" data-d="-999" aria-label="Retirer ${esc(p.name)}">✕</button></div></div></li>`; }).join('');
  return `<div class="pos">
    <section class="pos-left" aria-label="Produits">
      <div class="pos-top">
        <div class="demo-note">Démonstration avec des données d’exemple : rien n’est enregistré, tout repart de zéro au rechargement.</div>
        <div class="row"><h1>Caisse</h1><button type="button" class="btn" data-go="ventes">Ventes récentes</button></div>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="text" placeholder="Rechercher un produit…" aria-label="Rechercher un produit" value="${esc(state.search)}" autocomplete="off">
          ${state.search ? '<button type="button" data-clear aria-label="Effacer la recherche">✕</button>' : ''}</div>
        <div class="chips" role="tablist" aria-label="Catégories">${chips.map((c) => `<button type="button" role="tab" class="chip" data-cat="${c.id}" aria-selected="${state.cat === c.id}">${esc(c.name)}<small>${c.n}</small></button>`).join('')}</div>
      </div>
      <div class="grid-wrap">${list.length ? `<ul class="grid">${cards}</ul>` : '<div class="empty"><b>Aucun résultat</b>Modifiez la recherche ou la catégorie.</div>'}</div>
    </section>
    <aside class="cart${state.cartOpen ? ' open' : ''}" aria-label="Panier">
      <div class="cart-head"><h2>Panier <small>(${cartCount()} article${cartCount() > 1 ? 's' : ''})</small></h2>
        <span>${state.cart.length ? '<button type="button" class="link" data-empty>Vider</button>' : ''}<button type="button" class="link cart-close" data-cart-toggle>Fermer</button></span></div>
      ${state.cart.length ? `<ul class="lines">${lines}</ul>` : '<div class="lines empty"><b>Panier vide</b>Touchez un produit pour l’ajouter.</div>'}
      <div class="cart-foot">
        <div class="row"><b style="font-size:16px">Total</b><span class="total">${money(cartTotal())}</span></div>
        <div><p style="font-weight:500;margin-bottom:8px">Mode de paiement</p><div class="pay">${PAYMENTS.map((m) => `<button type="button" data-pay="${m}" aria-pressed="${state.pay === m}">${state.pay === m ? '✓ ' : ''}${m}</button>`).join('')}</div></div>
        <button type="button" class="btn primary big" data-validate ${state.cart.length ? '' : 'disabled'}>Valider la vente</button>
      </div>
    </aside>
    <div class="cartbar"><button type="button" class="btn primary big" data-cart-toggle><span>Panier (${cartCount()})</span><span>${money(cartTotal())}</span></button></div>
  </div>`;
}

function salesRows(limit) {
  return state.sales.slice(0, limit).map((s) => `<tr><td><b style="font-weight:500">${s.no}</b><small>Aujourd’hui ${s.time} · ${esc(s.pay)}</small></td>
    <td class="hide-sm">Aujourd’hui ${s.time}</td><td class="num hide-sm">${s.lines.reduce((n, l) => n + l.q, 0)}</td>
    <td class="num"><b style="font-weight:500">${money(s.total)}</b></td><td class="hide-sm">${esc(s.pay)}</td><td><span class="badge ok">Payée</span></td></tr>`).join('');
}
const salesTable = (limit) => `<div class="card"><div class="table-wrap"><table><thead><tr><th>Reçu</th><th class="hide-sm">Date</th><th class="num hide-sm">Articles</th><th class="num">Montant</th><th class="hide-sm">Paiement</th><th>Statut</th></tr></thead><tbody>${salesRows(limit)}</tbody></table></div></div>`;
const sum = (rows) => rows.reduce((s, r) => s + r.total, 0);

function viewVentes() {
  const total = sum(state.sales), cash = sum(state.sales.filter((s) => s.pay === 'Espèces')), n = state.sales.length;
  return `<div class="view">
    <div class="head"><div><h1>Mes ventes</h1><p>Vos ventes et leurs reçus.</p></div><button type="button" class="btn primary" data-go="caisse">+ Nouvelle vente</button></div>
    <div class="stats">
      <div class="card stat"><span>Encaissé aujourd’hui</span><b>${money(total)}</b><small>Hors ventes annulées</small></div>
      <div class="card stat"><span>Ventes aujourd’hui</span><b>${n}</b><small>Panier moyen ${money(Math.round(total / n))}</small></div>
      <div class="card stat"><span>Dont espèces</span><b>${money(cash)}</b><small>Ventes payées en espèces</small></div>
    </div>${salesTable(50)}</div>`;
}

function barList(items, fmt) {
  const max = Math.max(...items.map((i) => i.value), 1);
  return `<div class="bars">${items.map((i) => `<div><div class="row"><span>${esc(i.label)}</span><b style="font-weight:600">${fmt(i)}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(i.value / max) * 100}%"></div></div><small class="muted">${esc(i.detail)}</small></div>`).join('')}</div>`;
}
function viewBord() {
  const total = sum(state.sales), n = state.sales.length;
  const byPay = PAYMENTS.map((m) => { const r = state.sales.filter((s) => s.pay === m); return { label: m, value: sum(r), detail: `${r.length} vente(s) · ${total ? Math.round((sum(r) / total) * 100) : 0} %` }; }).filter((i) => i.value).sort((a, b) => b.value - a.value);
  const sold = {};
  state.sales.forEach((s) => s.lines.forEach((l) => { sold[l.id] = (sold[l.id] || 0) + l.q; }));
  const top = Object.entries(sold).map(([id, q]) => ({ label: prod(id).name, value: q, detail: money(q * prod(id).price) })).sort((a, b) => b.value - a.value).slice(0, 5);
  const low = PRODUCTS.filter((p) => p.stock !== null && p.stock <= 6);
  const date = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="view">
    <div class="head"><div><h1>Tableau de bord</h1><p>${date.charAt(0).toUpperCase() + date.slice(1)} · chiffres de la démonstration</p></div><button type="button" class="btn primary" data-go="caisse">Ouvrir la caisse</button></div>
    <div class="stats">
      <div class="card stat"><span>CA net du jour</span><b>${money(total)}</b><small>${n} vente(s) aujourd’hui</small></div>
      <div class="card stat"><span>Panier moyen</span><b>${money(Math.round(total / n))}</b><small>${state.sales.reduce((s, r) => s + r.lines.reduce((a, l) => a + l.q, 0), 0)} article(s) vendus</small></div>
      <div class="card stat"><span>Produits actifs</span><b>${PRODUCTS.length}</b><small>${low.length} en stock faible</small></div>
    </div>
    <div class="cols">
      <div class="card pad"><h2>Répartition des paiements</h2><p>Ventes par mode de paiement</p>${barList(byPay, (i) => money(i.value))}</div>
      <div class="card pad"><h2>Produits les plus vendus</h2><p>Par quantité, aujourd’hui</p>${barList(top, (i) => i.value + ' vendu(s)')}</div>
      <div class="card pad"><h2>Stock faible</h2><p>Produits à réapprovisionner</p><div class="bars">${low.map((p) => `<div class="row badge warn" style="width:100%;border-radius:8px;padding:8px 12px;font-size:14px"><b style="font-weight:500">${esc(p.name)}</b><span>${p.stock} restant(s)</span></div>`).join('')}</div></div>
    </div>
    <h2>Dernières transactions</h2>${salesTable(6)}</div>`;
}

function render() {
  const active = document.activeElement && document.activeElement.id === 'search';
  const pos = active ? document.activeElement.selectionStart : null;
  document.querySelectorAll('[data-view]').forEach((b) => b.toggleAttribute('aria-current', false));
  const cur = document.querySelector(`[data-view="${state.view}"]`); cur.setAttribute('aria-current', 'page');
  const main = document.getElementById('main');
  main.innerHTML = state.view === 'caisse' ? viewCaisse() : state.view === 'ventes' ? viewVentes() : viewBord();
  main.style.overflowY = state.view === 'caisse' ? 'hidden' : 'auto';
  if (active) { const input = document.getElementById('search'); input.focus(); input.setSelectionRange(pos, pos); }
}
function go(view) { state.view = view; state.cartOpen = false; document.getElementById('modal').innerHTML = ''; render(); document.getElementById('main').scrollTop = 0; }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.view) go(d.view);
  else if (d.go) go(d.go);
  else if (d.add) add(d.add);
  else if (d.cat) { state.cat = d.cat; render(); }
  else if (d.qty) setQty(d.qty, inCart(d.qty) + Number(d.d));
  else if (d.pay) { state.pay = d.pay; render(); }
  else if ('empty' in d) { state.cart = []; render(); }
  else if ('clear' in d) { state.search = ''; render(); document.getElementById('search').focus(); }
  else if ('cartToggle' in d) { state.cartOpen = !state.cartOpen; render(); }
  else if ('validate' in d) validate();
  else if ('close' in d) document.getElementById('modal').innerHTML = '';
});
document.addEventListener('input', (e) => { if (e.target.id === 'search') { state.search = e.target.value; render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('modal').innerHTML = ''; });
// Ventes d'exemple déjà enregistrées aujourd'hui.
[[['p2', 2], ['p13', 1]], [['p8', 2], ['p6', 2]], [['p17', 3], ['p9', 3]], [['p3', 1], ['p11', 2]], [['p5', 1], ['p14', 2]]]
  .forEach((items, i) => recordSale(items.map(([id, q]) => ({ id, q })), PAYMENTS[[0, 1, 0, 2, 0][i]], 17 + i, `1${i}:${10 + i * 7}`));
render();
</script>
<style>@media (min-width: 901px) { .cart-close { display: none; } }</style>

</body>
</html>
